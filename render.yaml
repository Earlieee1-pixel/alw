services:
  # ALW Laravel Web Service
  - type: web
    name: alw
    runtime: php
    plan: free
    buildCommand: |
      composer install --optimize-autoloader --no-dev --no-interaction
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: ALW
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: alw-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: alw-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: alw-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: alw-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: alw-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 180
      - key: SESSION_ENCRYPT
        value: true
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

databases:
  # ALW PostgreSQL Database
  - name: alw-db
    plan: free
    databaseName: alw
    user: alw
